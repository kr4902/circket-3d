<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>3D Cricket Stadium Game</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #87ceeb;
    }

    #scoreboard {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;

      background: rgba(0, 20, 40, 0.9);
      color: white;
      padding: 12px 25px;
      border-radius: 12px;
      border: 2px solid #ffd700;

      font-size: 18px;
      text-align: center;
      min-width: 320px;
    }

    #message {
      color: #ffdd00;
      margin-top: 6px;
      font-weight: bold;
    }

    #controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;

      background: rgba(0,0,0,0.75);
      color: white;
      padding: 10px 20px;
      border-radius: 15px;
      text-align: center;
    }

    #hitButton {
      margin-top: 8px;
      padding: 10px 35px;
      border: 0;
      border-radius: 20px;

      background: #ffb300;
      color: #000;

      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #hitButton:active {
      background: #ff6f00;
      transform: scale(0.95);
    }
  </style>

</head>

<body>

<div id="scoreboard">
  🏆 INDIA &nbsp;
  <span id="runs">0</span>/<span id="wickets">0</span>

  &nbsp; | &nbsp;

  Overs:
  <span id="overs">0.0</span>

  <div id="message">
    🏏 Get Ready!
  </div>
</div>

<div id="controls">
  PC: Press <b>SPACE</b> to hit the ball
  <br>
  Mobile:
  <button id="hitButton">🏏 HIT</button>
</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script>

// ======================================================
// GAME VARIABLES
// ======================================================

let score = 0;
let wickets = 0;
let balls = 0;

let ballActive = false;
let canHit = false;

let ball;

let ballSpeed = 0.24;


// ======================================================
// SCENE
// ======================================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);


// ======================================================
// CAMERA
// ======================================================

const camera = new THREE.PerspectiveCamera(
  55,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(0, 8, 18);

camera.lookAt(0, 1, 0);


// ======================================================
// RENDERER
// ======================================================

const renderer = new THREE.WebGLRenderer({

  antialias: true

});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);


// ======================================================
// LIGHTS
// ======================================================

scene.add(

  new THREE.AmbientLight(
    0xffffff,
    0.7
  )

);

const sunlight =
  new THREE.DirectionalLight(
    0xffffff,
    1
  );

sunlight.position.set(
  10,
  25,
  15
);

sunlight.castShadow = true;

scene.add(sunlight);


// ======================================================
// GROUND
// ======================================================

const groundGeometry =
  new THREE.CircleGeometry(
    45,
    64
  );

const groundMaterial =
  new THREE.MeshStandardMaterial({

    color: 0x238b45

  });

const ground =
  new THREE.Mesh(
    groundGeometry,
    groundMaterial
  );

ground.rotation.x =
  -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


// ======================================================
// BOUNDARY
// ======================================================

const boundaryGeometry =
  new THREE.TorusGeometry(
    31,
    0.13,
    8,
    100
  );

const boundaryMaterial =
  new THREE.MeshBasicMaterial({

    color: 0xffffff

  });

const boundary =
  new THREE.Mesh(
    boundaryGeometry,
    boundaryMaterial
  );

boundary.rotation.x =
  Math.PI / 2;

boundary.position.y = 0.03;

scene.add(boundary);


// ======================================================
// PITCH
// ======================================================

const pitchGeometry =
  new THREE.BoxGeometry(
    4,
    0.15,
    20
  );

const pitchMaterial =
  new THREE.MeshStandardMaterial({

    color: 0xcaa472

  });

const pitch =
  new THREE.Mesh(
    pitchGeometry,
    pitchMaterial
  );

pitch.position.y = 0.08;

pitch.receiveShadow = true;

scene.add(pitch);


// ======================================================
// PITCH WHITE LINES
// ======================================================

function addLine(z) {

  const line = new THREE.Mesh(

    new THREE.BoxGeometry(
      4,
      0.02,
      0.12
    ),

    new THREE.MeshBasicMaterial({

      color: 0xffffff

    })

  );

  line.position.set(
    0,
    0.17,
    z
  );

  scene.add(line);

}

addLine(7);

addLine(-7);


// ======================================================
// WICKETS
// ======================================================

function makeWickets(z) {

  const material =
    new THREE.MeshStandardMaterial({

      color: 0xf4e2b8

    });

  for(let i = -1; i <= 1; i++) {

    const stump =
      new THREE.Mesh(

        new THREE.CylinderGeometry(
          0.07,
          0.07,
          2,
          10
        ),

        material

      );

    stump.position.set(
      i * 0.32,
      1,
      z
    );

    stump.castShadow = true;

    scene.add(stump);

  }


  for(let i = -1; i <= 0; i++) {

    const bail =
      new THREE.Mesh(

        new THREE.CylinderGeometry(
          0.04,
          0.04,
          0.45,
          8
        ),

        material

      );

    bail.rotation.z =
      Math.PI / 2;

    bail.position.set(
      i * 0.32 + 0.16,
      2.02,
      z
    );

    scene.add(bail);

  }

}

makeWickets(7);

makeWickets(-7);


// ======================================================
// STADIUM
// ======================================================

const stadiumMaterial =
  new THREE.MeshStandardMaterial({

    color: 0x1565c0,
    side: THREE.DoubleSide

  });


for(let radius = 35; radius <= 41; radius += 2) {

  const stadiumGeometry =
    new THREE.CylinderGeometry(

      radius,
      radius,
      2,

      80,

      1,

      true

    );

  const stadium =
    new THREE.Mesh(

      stadiumGeometry,
      stadiumMaterial

    );

  stadium.position.y =
    1 + (radius - 35) * 0.45;

  scene.add(stadium);

}


// ======================================================
// CROWD
// ======================================================

const colors = [

  0xff0000,
  0xffff00,
  0x00aaff,
  0xffffff,
  0xff8800

];

for(let i = 0; i < 250; i++) {

  const angle =
    Math.random() *
    Math.PI * 2;

  const radius =
    35 +
    Math.random() * 5;


  const spectator =
    new THREE.Mesh(

      new THREE.SphereGeometry(
        0.12,
        6,
        6
      ),

      new THREE.MeshBasicMaterial({

        color:
          colors[
            Math.floor(
              Math.random() *
              colors.length
            )
          ]

      })

    );


  spectator.position.set(

    Math.cos(angle) * radius,

    2 + Math.random() * 3,

    Math.sin(angle) * radius

  );

  scene.add(spectator);

}


// ======================================================
// FLOODLIGHTS
// ======================================================

function createFloodLight(x,z) {

  const pole =
    new THREE.Mesh(

      new THREE.CylinderGeometry(
        0.18,
        0.25,
        15,
        10
      ),

      new THREE.MeshStandardMaterial({

        color: 0x555555

      })

    );

  pole.position.set(
    x,
    7.5,
    z
  );

  scene.add(pole);


  const lights =
    new THREE.Mesh(

      new THREE.BoxGeometry(
        4,
        1.2,
        0.5
      ),

      new THREE.MeshBasicMaterial({

        color: 0xffffdd

      })

    );

  lights.position.set(
    x,
    15,
    z
  );

  scene.add(lights);

}


createFloodLight(27,27);

createFloodLight(-27,27);

createFloodLight(27,-27);

createFloodLight(-27,-27);


// ======================================================
// BATSMAN
// ======================================================

const batsman =
  new THREE.Group();


// BODY

const body =
  new THREE.Mesh(

    new THREE.BoxGeometry(
      0.8,
      1.8,
      0.5
    ),

    new THREE.MeshStandardMaterial({

      color: 0x0057b8

    })

  );

body.position.y = 2.1;

batsman.add(body);


// HEAD

const head =
  new THREE.Mesh(

    new THREE.SphereGeometry(
      0.4,
      16,
      16
    ),

    new THREE.MeshStandardMaterial({

      color: 0xd49a6a

    })

  );

head.position.y = 3.45;

batsman.add(head);


// HELMET

const helmet =
  new THREE.Mesh(

    new THREE.SphereGeometry(
      0.44,
      16,
      8
    ),

    new THREE.MeshStandardMaterial({

      color: 0x002d62

    })

  );

helmet.position.y = 3.6;

batsman.add(helmet);


// LEGS

for(let x of [-0.25,0.25]) {

  const leg =
    new THREE.Mesh(

      new THREE.BoxGeometry(
        0.25,
        1.6,
        0.3
      ),

      new THREE.MeshStandardMaterial({

        color: 0xffffff

      })

    );

  leg.position.set(
    x,
    0.8,
    0
  );

  batsman.add(leg);

}


batsman.position.set(
  0,
  0,
  5.7
);

scene.add(batsman);


// ======================================================
// BAT
// ======================================================

const batPivot =
  new THREE.Group();

batPivot.position.set(
  0.7,
  2.4,
  5.7
);

scene.add(batPivot);


const bat =
  new THREE.Mesh(

    new THREE.BoxGeometry(
      0.45,
      2.5,
      0.18
    ),

    new THREE.MeshStandardMaterial({

      color: 0xd8a45d

    })

  );

bat.position.y = -0.8;

bat.rotation.z = -0.25;

batPivot.add(bat);


// HANDLE

const handle =
  new THREE.Mesh(

    new THREE.CylinderGeometry(
      0.08,
      0.08,
      1,
      10
    ),

    new THREE.MeshStandardMaterial({

      color: 0x222222

    })

  );

handle.position.y = 0.9;

bat.add(handle);


// ======================================================
// BALL
// ======================================================

function createBall() {

  if(ball) {

    scene.remove(ball);

  }


  ball =
    new THREE.Mesh(

      new THREE.SphereGeometry(
        0.20,
        20,
        20
      ),

      new THREE.MeshStandardMaterial({

        color: 0xcc0000,
        roughness: 0.6

      })

    );


  ball.position.set(
    0,
    1,
    -8
  );


  ball.castShadow = true;

  scene.add(ball);

}


// ======================================================
// SCOREBOARD
// ======================================================

function updateScoreboard() {

  document.getElementById("runs")
    .textContent = score;

  document.getElementById("wickets")
    .textContent = wickets;


  const completedOvers =
    Math.floor(balls / 6);

  const remainingBalls =
    balls % 6;


  document.getElementById("overs")
    .textContent =
      completedOvers +
      "." +
      remainingBalls;

}


// ======================================================
// NEW BALL
// ======================================================

function bowlBall() {

  if(wickets >= 10) {

    document.getElementById("message")
      .textContent =
      "🏁 GAME OVER! Final Score: " +
      score;

    return;

  }


  createBall();

  ball.position.x =
    (Math.random() - 0.5) * 1.2;

  ball.position.z = -8;

  ball.position.y =
    0.8 + Math.random() * 0.5;


  ballActive = true;

  canHit = true;


  document.getElementById("message")
    .textContent =
    "⚡ Bowler is bowling...";

}


// ======================================================
// BAT SWING
// ======================================================

let swinging = false;

let swingAngle = 0;


function swingBat() {

  if(swinging) return;

  swinging = true;

  swingAngle = 0;


  // CHECK BALL HIT

  if(
    ballActive &&
    canHit &&
    ball.position.z > 3.5 &&
    ball.position.z < 7.5
  ) {

    canHit = false;

    ballActive = false;


    let possibleRuns = [

      1,
      2,
      4,
      6

    ];


    let runs =
      possibleRuns[
        Math.floor(
          Math.random() *
          possibleRuns.length
        )
      ];


    score += runs;

    balls++;


    document.getElementById("message")
      .textContent =

      runs === 6 ?

      "🔥 SIX! What a shot!" :

      runs === 4 ?

      "💥 FOUR!" :

      "🏏 " + runs + " Run";


    updateScoreboard();


    // BALL FLIES AFTER HIT

    let flyTime = 0;


    function flyBall() {

      flyTime++;

      ball.position.z -= 0.25;

      ball.position.x +=
        0.10;

      ball.position.y +=
        0.12 -
        flyTime * 0.002;


      if(flyTime < 90) {

        requestAnimationFrame(flyBall);

      }

    }

    flyBall();


    setTimeout(
      bowlBall,
      1800
    );

  }

}


// ======================================================
// MISS / WICKET
// ======================================================

function missedBall() {

  if(!ballActive)
    return;


  ballActive = false;

  canHit = false;

  balls++;


  const wicketChance =
    Math.random();


  if(wicketChance < 0.35) {

    wickets++;

    document.getElementById("message")
      .textContent =
      "😱 OUT! WICKET!";

  }

  else {

    document.getElementById("message")
      .textContent =
      "⚪ Dot Ball";

  }


  updateScoreboard();


  setTimeout(
    bowlBall,
    1400
  );

}


// ======================================================
// KEYBOARD CONTROL
// ======================================================

window.addEventListener(
  "keydown",
  function(event) {

    if(event.code === "Space") {

      event.preventDefault();

      swingBat();

    }

  }
);


// ======================================================
// MOBILE CONTROL
// ======================================================

document.getElementById("hitButton")
  .addEventListener(

    "click",

    swingBat

  );


// ======================================================
// WINDOW RESIZE
// ======================================================

window.addEventListener(
  "resize",
  function() {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


// ======================================================
// ANIMATION LOOP
// ======================================================

function animate() {

  requestAnimationFrame(
    animate
  );


  // BALL MOVEMENT

  if(ballActive && ball) {

    ball.position.z +=
      ballSpeed;


    // small bounce

    if(
      ball.position.z > 0 &&
      ball.position.z < 1
    ) {

      ball.position.y =
        Math.max(
          0.25,
          ball.position.y - 0.15
        );

    }


    if(
      ball.position.z > 8
    ) {

      missedBall();

    }

  }


  // BAT ANIMATION

  if(swinging) {

    swingAngle += 0.15;

    batPivot.rotation.z =
      -Math.sin(swingAngle)
      * 1.5;


    if(swingAngle >= Math.PI) {

      batPivot.rotation.z = 0;

      swinging = false;

    }

  }


  renderer.render(
    scene,
    camera
  );

}


// ======================================================
// START GAME
// ======================================================

updateScoreboard();

setTimeout(
  bowlBall,
  1000
);

animate();

</script>

</body>
</html>
